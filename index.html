<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrale Agenten-Steuerung</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #e4e4ed; padding: 20px; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; box-sizing: border-box; }
        h2 { color: #8ab4f8; text-align: center; margin-top: 0; font-size: 1.4rem; letter-spacing: 0.5px; }
        #chat { flex-grow: 1; border: 1px solid #2a2a35; padding: 15px; margin-bottom: 15px; overflow-y: auto; background: #16161f; border-radius: 12px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); }
        .user-line { margin: 10px 0; color: #e4e4ed; }
        .system-line { margin: 10px 0; color: #8ab4f8; font-style: italic; }
        .agent-line { margin: 10px 0; color: #a8d5ba; background: #1e1e2d; padding: 12px; border-radius: 8px; border-left: 4px solid #8ab4f8; white-space: pre-wrap; line-height: 1.4; }
        .msg-box { display: flex; gap: 10px; width: 100%; }
        input { flex-grow: 1; padding: 14px; background: #22222e; color: #fff; border: 1px solid #3a3a4c; border-radius: 10px; font-size: 1rem; outline: none; }
        input:focus { border-color: #8ab4f8; }
        button { padding: 14px 24px; background: #8ab4f8; color: #0f0f12; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <h2>🤖 AUTONOMES NETZWERK</h2>
    <div id="chat"><div class="system-line">System online. Bereit für evolutionäre Befehle...</div></div>
    <div class="msg-box">
        <input type="text" id="msg" placeholder="Befehl an das Netzwerk eintippen..." onkeypress="if(event.key === 'Enter') send();">
        <button onclick="send()">Senden</button>
    </div>
    <script>
        // Deine Make Webhook URL (ohne ?value= Anhang)
        const webhookUrl = "https://hook.eu1.make.com/jojwhpfib9gbc4lxkpci1yrlvieh1ujt";

        async function send() {
            let msgInput = document.getElementById('msg');
            let msg = msgInput.value;
            let chat = document.getElementById('chat');
            if(!msg.trim()) return;

            // Nachricht im Chat anzeigen
            chat.innerHTML += '<div class="user-line"><b>Du:</b> ' + escapeHtml(msg) + '</div>';
            msgInput.value = '';
            chat.scrollTop = chat.scrollHeight;

            chat.innerHTML += '<div class="system-line" id="loading">➔ Analysiere Netzwerk & verarbeite Befehl...</div>';
            chat.scrollTop = chat.scrollHeight;

            try {
                // Wir schicken den Text als JSON an den Make Webhook
                let response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ value: msg })
                });

                // Lade-Hinweis entfernen
                let loader = document.getElementById('loading');
                if(loader) loader.remove();

                if (response.ok) {
                    let agentAnswer = await response.text();
                    chat.innerHTML += '<div class="agent-line"><b>Agent [Evolution Core]:</b><br>' + escapeHtml(agentAnswer) + '</div>';
                } else {
                    chat.innerHTML += '<div class="system-line" style="color:#ff6b6b">⚠️ Netzwerk hat mit Status ' + response.status + ' geantwortet.</div>';
                }
                chat.scrollTop = chat.scrollHeight;

            } catch (err) {
                let loader = document.getElementById('loading');
                if(loader) loader.remove();
                chat.innerHTML += '<div class="system-line" style="color:#ff6b6b">⚠️ Verbindung zum Netzwerk fehlgeschlagen: ' + err.message + '</div>';
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
